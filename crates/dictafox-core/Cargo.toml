[package]
name = "dictafox-core"
version = "0.1.2"
edition = "2021"
description = "Local-first dictation engine behind DictaFox: audio capture, whisper.cpp transcription, text refinement and text delivery."
license = "MIT"
authors = ["Vormela Core"]
repository = "https://github.com/VORMELA-CORE/dictafox"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
hound = "3.5"
whisper-rs = "0.14"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.15"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[dev-dependencies]
tempfile = "3"
