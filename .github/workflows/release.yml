name: Release

# Push a tag such as v0.1.0 to build installers for every platform and publish
# them to a GitHub Release. Run manually to get the installers as workflow
# artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (deb, rpm, AppImage)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: Windows x86_64 (msi, exe)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: macOS Apple Silicon (dmg)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel (dmg)
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file cmake clang rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build installers
        shell: bash
        run: |
          # whisper.cpp must not tune for the CI machine's CPU, or the app
          # crashes with "illegal instruction" on users' hardware.
          root="$PWD"
          if command -v cygpath >/dev/null; then root="$(cygpath -m "$PWD")"; fi
          export CMAKE_PROJECT_INCLUDE_BEFORE="$root/scripts/ci/portable-cpu.cmake"
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          bundle="target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp {} out/ \;
          if [ -d "$bundle/macos" ]; then
            (cd "$bundle/macos" && tar -czf "$GITHUB_WORKSPACE/out/DictaFox_${{ matrix.target }}.app.tar.gz" DictaFox.app)
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dictafox-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Checksums
        run: cd dist-release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist-release/* \
            --title "DictaFox ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md
